<ng-container *ngIf="product">
  <div class="customization-modal">
    <div class="modal-header">
      <div class="header-left">
        <span class="item-name">{{ product.productName }}</span>
        <span class="dot-separator">•</span>
        <span class="item-price">Base: ₹{{ product.price }}</span>
      </div>
      <button class="close-btn" (click)="cancel()">×</button>
    </div>

    <hr class="divider" />

    <div class="modal-body">
      <div class="section-label">Select Customization</div>

      <div class="customization-options">
        <div class="option-item">
          <label>
            <input
              type="radio"
              [value]="null"
              name="customOption"
              [(ngModel)]="selectedOption"
            />
            <span class="checkmark"></span>
            <span class="option-name">None (Standard)</span>
            <span class="option-price">₹0</span>
          </label>
        </div>

        <div *ngFor="let option of product.customizationOptions" class="option-item">
          <label>
            <input
              type="radio"
              [value]="option.customizationOptionID"
              name="customOption"
              [(ngModel)]="selectedOption"
            />
            <span class="checkmark"></span>
            <span class="option-name">{{ option.name }}</span>
            <span class="option-price">
              +₹{{ option.fixedPrice | number:'1.0-0' }}
            </span>
          </label>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="footer-left">
        <div class="price-label">Total Payable</div>
        <span class="total-price">₹{{ getSelectedPrice() | number:'1.2-2' }}</span>
      </div>
      <button class="add-to-cart-btn" (click)="confirm()">
        Add to Cart
      </button>
    </div>
  </div>
</ng-container>
