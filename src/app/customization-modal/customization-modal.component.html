<ng-container *ngIf="product">
  <div class="customization-modal">
    <!-- HEADER -->
    <div class="modal-header">
      <div class="header-left">
        <!-- ProductName • Price -->
        <span class="item-name">{{ product.productName }}</span>
        <span class="dot-separator">•</span>
        <span class="item-price">₹{{ product.price }}</span>
      </div>
      <!-- Close button -->
      <button class="close-btn" (click)="cancel()">×</button>
    </div>

    <hr class="divider" />

    <!-- BODY: Quantity / Customization Options -->
    <div class="modal-body">
      <div class="section-label">Quantity</div>

      <div class="customization-options">
        <!-- None Option -->
        <div class="option-item">
          <label>
            <input
              type="radio"
              [value]="null"
              name="customOption"
              [(ngModel)]="selectedOption"
            />
            <span class="checkmark"></span>
            <span class="option-name">None</span>
            <span class="option-price">₹0</span>
          </label>
        </div>

        <!-- Existing customization options -->
        <div *ngFor="let option of product.customizationOptions" class="option-item">
          <label>
            <input
              type="radio"
              [value]="option.customizationOptionID"
              name="customOption"
              [(ngModel)]="selectedOption"
            />
            <span class="checkmark"></span>
            <span class="option-name">{{ option.name }}</span>
            <span class="option-price">
              ₹{{ option.fixedPrice | number:'1.0-0' }}
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- FOOTER: Total + Add to Cart -->
    <div class="modal-footer">
      <div class="footer-left">
        <span class="total-price">₹{{ getSelectedPrice() }}</span>
      </div>
      <button
        class="add-to-cart-btn"
        (click)="confirm()"
      >
        Add Item to cart
      </button>
    </div>
  </div>
</ng-container>
